# WeatherGPT — Alembic migration configuration.
#
# The database URL is intentionally NOT hardcoded here: it is injected at
# runtime by app/db/migrations/env.py from the application Settings (asyncpg URL),
# supporting local dev, native Linux, and production without duplication.
#
# Usage:
#   alembic upgrade head
#   alembic downgrade -1
#   alembic revision --autogenerate -m "describe change"

[alembic]
# Path to the migration scripts.
script_location = app/db/migrations

# Prepend the current working directory to sys.path so 'app' is importable.
prepend_sys_path = .

# Template used when generating new migration files.
file_template = %%(rev)s_%%(slug)s

# Time zone to use when writing revision timestamps.
timezone = UTC

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
