[pytest]
# Register custom markers (prevents PytestUnknownMarkWarning).
markers =
    integration: requires a live PostgreSQL/PostGIS instance (skipped when unavailable)
asyncio_mode = strict
# Share a single event loop for async tests AND async fixtures. This is required
# on Windows (ProactorEventLoop) so that a module-scoped async engine/session is
# created and reused within the same loop asyncpg bound its connections to.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
